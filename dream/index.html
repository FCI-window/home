<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>DRE&M | FCI</title>
</head>
<body>
  <p>Loading DRE&M…</p>
  <noscript>
    <p><a href="./index_ko.html">한국어</a> · <a href="./index_en.html">English</a></p>
  </noscript>
  <script>
    (() => {
      const supported = ["ko", "en"];
      const requested = new URLSearchParams(location.search).get("lang");
      const languages = navigator.languages || [navigator.language || ""];
      let savedLanguage = "";

      try {
        savedLanguage = localStorage.getItem("fci-language") || "";
      } catch (_) {}

      const browserLanguage = languages.some(value => /^ko(?:-|$)/i.test(value)) ? "ko" : "en";
      const language = supported.includes(requested) ? requested :
        supported.includes(savedLanguage) ? savedLanguage : browserLanguage;

      location.replace("./index_" + language + ".html");
    })();
  </script>
</body>
</html>
