<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RAB | FCI</title>
</head>
<body>
  <p>Loading RAB…</p>
  <noscript>
    <p><a href="./index_ko.html">한국어</a> · <a href="./index_en.html">English</a></p>
  </noscript>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const requested = params.get("lang");
      const supported = ["ko", "en"];
      const languages = navigator.languages || [navigator.language || ""];
      let savedLanguage = "";

      try {
        savedLanguage = localStorage.getItem("fci-language") || "";
      } catch (_) {}

      const browserLanguage = languages.find(value =>
        supported.some(code => value.toLowerCase().startsWith(code))
      );

      const language = supported.includes(requested) ? requested :
        supported.includes(savedLanguage) ? savedLanguage :
        browserLanguage ? browserLanguage.slice(0, 2).toLowerCase() :
        "en";

      location.replace("./index_" + language + ".html");
    })();
  </script>
</body>
</html>
