<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>RAB | FCI</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 8%, rgba(225, 189, 112, .24), transparent 34rem),
        radial-gradient(circle at 90% 38%, rgba(237, 216, 164, .32), transparent 30rem),
        linear-gradient(180deg, #fffdf8 0%, #faf1df 100%);
    }

    body {
      color: #2d261d;
      font-family: system-ui, sans-serif;
    }

    .loading-screen {
      min-height: 100vh;
      padding: 32px 24px;
      box-sizing: border-box;
    }

    .loading-logo {
      display: block;
      width: 64px;
      height: 64px;
    }

    .loading-message {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="loading-screen" aria-label="RAB loading">
    <img class="loading-logo" src="../images/Logo_RAB.png" alt="성경낭독녹음">
    <p class="loading-message">Loading RAB…</p>
  </main>
  <noscript>
    <p>
      <a href="./index_ko.html" lang="ko">한국어</a> ·
      <a href="./index_en.html" lang="en">English</a> ·
      <a href="./index_ja.html" lang="ja">日本語</a> ·
      <a href="./index_zh-CN.html" lang="zh-CN">简体中文</a> ·
      <a href="./index_zh-TW.html" lang="zh-TW">繁體中文</a>
    </p>
  </noscript>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const requested = params.get("lang");
      const supported = ["ko", "en", "ja", "zh-CN", "zh-TW"];
      const languages = navigator.languages || [navigator.language || ""];
      let savedLanguage = "";

      try {
        savedLanguage = localStorage.getItem("fci-language") || "";
      } catch (_) {}

      const browserLanguage = languages.find(value => {
        const normalized = value.toLowerCase();
        return supported.some(code => {
          const normalizedCode = code.toLowerCase();
          return normalized === normalizedCode || normalized.startsWith(normalizedCode + "-");
        });
      });

      const browserCode = browserLanguage ? supported.find(code => {
        const normalized = browserLanguage.toLowerCase();
        const normalizedCode = code.toLowerCase();
        return normalized === normalizedCode || normalized.startsWith(normalizedCode + "-");
      }) : "";

      const language = supported.includes(requested) ? requested :
        supported.includes(savedLanguage) ? savedLanguage :
        browserCode || "en";

      location.replace("./index_" + language + ".html");
    })();
  </script>
</body>
</html>
