<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">

<link rel="icon" type="image/png" sizes="32x32" href="/dailyjapanese/images/yotobo-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/dailyjapanese/images/yotobo-192.png"><link rel="apple-touch-icon" href="/dailyjapanese/images/yotobo-180.png">
<style>
:root{--bg:#F5F4ED;--ink:#3A2F5C;--inkSoft:#3F3852;--textMuted:#6E6884;--textFaint:#837D93;--accentStrong:#6A5A9A;--accent:#7E6CA8;--accentLight:#B3A8D0;--borderStrong:#D6D0E6;--border:#DFDAEC;--tint:#F1EEF8;--tintStrong:#EBE7F5;--tintSoft:#F6F4FB}

#pop .note{margin-top:10px}#pop button{display:block;margin:14px 0 0 auto;border:0;background:none;color:var(--ink);font-weight:700;font-size:15px;padding:6px 10px}
#msg{text-align:center;padding:60px 16px;color:var(--textMuted)}
</style></head><body>
<header>5日本語</header>
<main><div id="msg">리포트를 불러오는 중입니다…</div><div id="app" hidden></div></main>
