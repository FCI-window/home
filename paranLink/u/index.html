<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>파란: 그분들의 이야기</title>
  <meta property="og:title" content="파란: 그분들의 이야기" />
  <meta property="og:image" content="https://www.fciapp.com/images/Paran.jpg" />
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
           font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #F4F8FF; color: #102033; }
    p { font-size: 20px; font-weight: 700; margin: 0 24px 24px; text-align: center; }
    a { display: inline-block; padding: 16px 36px; border-radius: 999px; background: #2478FF; color: #fff;
        font-size: 20px; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <p>파란 앱을 엽니다</p>
  <a id="open" href="#">파란 열기</a>

  <script>
    // 초대 링크: https://www.fciapp.com/paranLink/u/?id=<uid>
    // 앱이 있으면 보통 이 페이지가 뜨기 전에 앱이 열린다(유니버설 링크·앱 링크).
    // 카카오톡 안 브라우저처럼 그렇지 않은 곳에서는 paran:// 로 한 번 더 열고, 앱이 없으면 스토어로 보낸다.
    var IOS_STORE = "https://apps.apple.com/app/id6760983914";
    var ANDROID_STORE = "https://play.google.com/store/apps/details?id=com.fciapp.TMOStory";
    var FALLBACK_URL = "https://www.fciapp.com/paran";

    var id = (new URLSearchParams(location.search).get("id") || "").replace(/[^A-Za-z0-9_-]/g, "");
    var ua = navigator.userAgent || "";
    var isAndroid = /android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var appUrl = "paran://u" + (id ? "?id=" + id : "");

    function openApp() {
      if (isAndroid) {
        location.href = "intent://u" + (id ? "?id=" + id : "") +
          "#Intent;scheme=paran;package=com.fciapp.TMOStory;S.browser_fallback_url=" +
          encodeURIComponent(ANDROID_STORE) + ";end";
        return;
      }
      if (isIOS) {
        var started = Date.now();
        location.href = appUrl;
        setTimeout(function () {
          // 앱이 열렸으면 페이지가 가려져 있다. 그대로 보이면 앱이 없는 것으로 보고 스토어로.
          if (!document.hidden && Date.now() - started < 3000) location.href = IOS_STORE;
        }, 1600);
        return;
      }
      location.replace(FALLBACK_URL);
    }

    document.getElementById("open").addEventListener("click", function (e) { e.preventDefault(); openApp(); });
    openApp();
  </script>
</body>
</html>
