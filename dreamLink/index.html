<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Open DRE&amp;M</title>
  <meta property="og:image" content="https://www.fciapp.com/images/DREAM_trans.png" />
  <style>
    body {
      margin: 0;
      padding: 2rem 1.25rem;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      max-width: 32rem;
      margin: 0 auto;
    }

    .store-link {
      display: block;
      margin: 0.75rem auto;
      padding: 0.85rem 1rem;
      border-radius: 0.5rem;
      background: #222;
      color: #fff;
      text-decoration: none;
    }

    .app-link {
      background: #0b6bcb;
    }

    .hidden {
      display: none;
    }

    #message {
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <main>
    <h1>DRE&amp;M</h1>
    <p id="message">Install the DRE&amp;M app to join the invited group.</p>
    <a id="open-app" class="store-link app-link hidden" href="#"></a>
    <div id="store-links"></div>
  </main>

  <script>
    const IOS_BASE_URL =
      "https://apps.apple.com/kr/app/id6775331954";

    const ANDROID_BASE_URL =
      "https://play.google.com/store/apps/details?id=com.fciapp.dream";

    const FALLBACK_URL = "https://www.fciapp.com/dream";

    const messages = {
      ko: {
        text: "초대받은 그룹에 참여하려면\nDRE&M 앱의 설치가 필요합니다",
        openApp: "DRE&M 앱 열기",
        ios: "App Store에서 설치",
        android: "Google Play에서 설치"
      },
      en: {
        text: "To join the invited group,\nplease install the DRE&M app.",
        openApp: "Open the DRE&M app",
        ios: "Install on the App Store",
        android: "Install on Google Play"
      },
      ja: {
        text: "招待されたグループに参加するには、\nDRE&Mアプリのインストールが必要です。",
        openApp: "DRE&Mアプリを開く",
        ios: "App Storeからインストール",
        android: "Google Playからインストール"
      },
      es: {
        text: "Para unirte al grupo invitado,\ninstala la aplicación DRE&M.",
        openApp: "Abrir la aplicación DRE&M",
        ios: "Instalar desde App Store",
        android: "Instalar desde Google Play"
      },
      "zh-Hans": {
        text: "要加入受邀群组，\n请安装 DRE&M 应用。",
        openApp: "打开 DRE&M 应用",
        ios: "从 App Store 安装",
        android: "从 Google Play 安装"
      },
      "zh-Hant": {
        text: "要加入受邀群組，\n請安裝 DRE&M 應用程式。",
        openApp: "開啟 DRE&M 應用程式",
        ios: "從 App Store 安裝",
        android: "從 Google Play 安裝"
      }
    };

    function getLanguage() {
      const languages = navigator.languages?.length
        ? navigator.languages
        : [navigator.language || "en"];

      for (const value of languages) {
        const language = value.toLowerCase();

        if (language.startsWith("ko")) return "ko";
        if (language.startsWith("ja")) return "ja";
        if (language.startsWith("es")) return "es";

        if (
          language.startsWith("zh-tw") ||
          language.startsWith("zh-hk") ||
          language.startsWith("zh-mo") ||
          language.includes("hant")
        ) {
          return "zh-Hant";
        }

        if (
          language.startsWith("zh") ||
          language.includes("hans")
        ) {
          return "zh-Hans";
        }

        if (language.startsWith("en")) return "en";
      }

      return "en";
    }

    const language = getLanguage();

    document.documentElement.lang = language;
    document.title = "DRE&M";
    document.getElementById("message").textContent = messages[language].text;

    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isAndroid = /android/i.test(ua);
    const isIOS = /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const storeLinks = document.getElementById("store-links");
    const openAppLink = document.getElementById("open-app");
    const inviteCode = new URLSearchParams(window.location.search).get("code") || "";

    openAppLink.href = `dream://join${inviteCode ? `?code=${encodeURIComponent(inviteCode)}` : ""}`;
    openAppLink.textContent = messages[language].openApp;

    if (isAndroid) {
      openAppLink.classList.remove("hidden");
      const storeLanguage = {
        en: "en",
        ja: "ja",
        es: "es",
        "zh-Hans": "zh-CN",
        "zh-Hant": "zh-TW"
      }[language];

      storeLinks.innerHTML =
        `<a class="store-link" href="${ANDROID_BASE_URL}&hl=${storeLanguage}">${messages[language].android}</a>`;
    } else if (isIOS) {
      openAppLink.classList.remove("hidden");
      const storeLanguage = {
        en: "en",
        ja: "ja",
        es: "es",
        "zh-Hans": "zh-Hans",
        "zh-Hant": "zh-Hant"
      }[language];

      storeLinks.innerHTML =
        `<a class="store-link" href="${IOS_BASE_URL}?l=${storeLanguage}">${messages[language].ios}</a>`;
    } else {
      window.location.replace(FALLBACK_URL);
    }
  </script>
</body>
</html>
