<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ROHD | FCI</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(135deg, rgba(36, 76, 134, .12), transparent 34%),
        linear-gradient(225deg, rgba(180, 139, 55, .10), transparent 28%),
        #f6f8fb;
    }

    body {
      color: #20283a;
      font-family: system-ui, sans-serif;
    }

    .loading-screen {
      min-height: 100vh;
      padding: 32px 24px;
      box-sizing: border-box;
    }

    .loading-logo {
      display: block;
      width: 64px;
      height: 64px;
    }

    .loading-message {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="loading-screen" aria-label="ROHD loading">
    <img class="loading-logo" src="../images/Logo_ROHD.png" alt="ROHD">
    <p class="loading-message">Loading ROHD…</p>
  </main>
  <noscript>
    <p><a href="./index_ko.html" lang="ko">한국어</a> · <a href="./index_en.html" lang="en">English</a> · <a href="./index_es.html" lang="es">Español</a> · <a href="./index_ja.html" lang="ja">日本語</a> · <a href="./index_zh-CN.html" lang="zh-CN">简体中文</a> · <a href="./index_zh-TW.html" lang="zh-TW">繁體中文</a></p>
  </noscript>
  <script>
    (() => {
      const supported = ["ko", "en", "es", "ja", "zh-CN", "zh-TW"];
      const requested = new URLSearchParams(location.search).get("lang");
      const languages = navigator.languages || [navigator.language || ""];
      let savedLanguage = "";

      try {
        savedLanguage = localStorage.getItem("fci-language") || "";
      } catch (_) {}

      const browserLanguage = languages.some(value => /^ko(?:-|$)/i.test(value)) ? "ko" :
        languages.some(value => /^es(?:-|$)/i.test(value)) ? "es" :
        languages.some(value => /^ja(?:-|$)/i.test(value)) ? "ja" :
        languages.some(value => /^zh-(?:TW|HK|MO)(?:-|$)/i.test(value)) ? "zh-TW" :
        languages.some(value => /^zh(?:-|$)/i.test(value)) ? "zh-CN" : "en";
      const language = supported.includes(requested) ? requested :
        supported.includes(savedLanguage) ? savedLanguage : browserLanguage;

      location.replace("./index_" + language + ".html");
    })();
  </script>
</body>
</html>
