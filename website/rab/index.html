<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FCI</title></head><body><a href="index_ko.html">한국어</a><script>(()=>{const supported=['zh-TW', 'ko', 'ja', 'en', 'zh-CN'];let saved='';try{saved=localStorage.getItem('fci-language')||''}catch(e){}function match(v){v=v||'';if(supported.includes(v))return v;if(/^zh/i.test(v)){const c=/TW|HK|MO|Hant/i.test(v)?'zh-TW':'zh-CN';return supported.includes(c)?c:''}const c=v.split('-')[0];return supported.includes(c)?c:''}const code=match(saved)||(navigator.languages||[navigator.language]).map(match).find(Boolean)||(supported.includes('en')?'en':'ko');location.replace('index_'+code+'.html'+location.search+location.hash)})();</script></body></html>
