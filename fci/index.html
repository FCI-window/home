<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FCI Story | Factory of Creative Imagination</title>
</head>
<body>
  <p>Loading FCI Story…</p>
  <noscript>
    <p><a href="./index_ko.html">한국어</a> · <a href="./index_en.html">English</a></p>
  </noscript>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const requested = params.get("lang");
      const supported = ["ko", "en"];

      let saved = "";
      try {
        saved = localStorage.getItem("fci-language") || "";
      } catch (_) {}

      const browserLanguage =
        (navigator.languages || [navigator.language || ""])
          .find(value => supported.some(code => value.toLowerCase().startsWith(code)));

      const language =
        supported.includes(requested) ? requested :
        supported.includes(saved) ? saved :
        browserLanguage ? browserLanguage.slice(0, 2) :
        "en";

      try {
        localStorage.setItem("fci-language", language);
      } catch (_) {}

      location.replace("./index_" + language + ".html");
    })();
  </script>
</body>
</html>
