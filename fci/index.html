<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FCI Story | Factory of Creative Imagination</title>
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        linear-gradient(135deg, rgba(47,91,255,.12), transparent 34%),
        linear-gradient(225deg, rgba(47,91,255,.08), transparent 28%), #f7f9fd;
    }

    body {
      color: #1f2a44;
      font-family: system-ui, sans-serif;
    }

    .loading-screen {
      min-height: 100vh;
      padding: 32px 24px;
      box-sizing: border-box;
    }

    .loading-logo {
      display: block;
      width: 64px;
      height: 64px;
    }

    .loading-message {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="loading-screen" aria-label="FCI loading">
    <img class="loading-logo" src="../images/FCILOGO.png" alt="FCI">
    <p class="loading-message">Loading FCI Story…</p>
  </main>
  <noscript>
    <p><a href="./index_ko.html" lang="ko">한국어</a> · <a href="./index_en.html" lang="en">English</a> · <a href="./index_ja.html" lang="ja">日本語</a> · <a href="./index_zh-CN.html" lang="zh-CN">简体中文</a> · <a href="./index_zh-TW.html" lang="zh-TW">繁體中文</a> · <a href="./index_es.html" lang="es">Español</a></p>
  </noscript>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const requested = params.get("lang");
      const supported = ["ko", "en", "ja", "zh-CN", "zh-TW", "es"];

      let saved = "";
      try {
        saved = localStorage.getItem("fci-language") || "";
      } catch (_) {}

      const browserLanguages = navigator.languages || [navigator.language || ""];
      const browserLanguage = browserLanguages.find(value =>
        /^(ko|en|ja|es)(?:-|$)/i.test(value) || /^zh(?:-|$)/i.test(value)
      );
      const detectedLanguage = browserLanguage && /^(zh-(?:TW|HK|MO)|zh-Hant)(?:-|$)/i.test(browserLanguage)
        ? "zh-TW"
        : browserLanguage && /^zh(?:-|$)/i.test(browserLanguage)
        ? "zh-CN"
        : browserLanguage ? browserLanguage.slice(0, 2).toLowerCase() : "";

      const language =
        supported.includes(requested) ? requested :
        supported.includes(saved) ? saved :
        supported.includes(detectedLanguage) ? detectedLanguage :
        "en";

      try {
        localStorage.setItem("fci-language", language);
      } catch (_) {}

      location.replace("./index_" + language + ".html");
    })();
  </script>
</body>
</html>
